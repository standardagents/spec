# Install-script approvals across pnpm generations: 10.4+ reads
# onlyBuiltDependencies, v11 reads the allowBuilds map. Without approval,
# pnpm 11 hard-fails install with ERR_PNPM_IGNORED_BUILDS and the Astro
# build never runs.
onlyBuiltDependencies:
  - esbuild
  - sharp
  - workerd
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
