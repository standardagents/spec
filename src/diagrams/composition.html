<!--
  A parent agent that composes the agent from Example 2, with submit_triage and a
  handler on side B added (Examples, section 6).

  Each agent has the same dashed AGENT frame, sides, chips, and tool bars as the
  first two diagrams. The edges between the frames show the composition, from top
  to bottom in time order: the parent waits, it creates the child with a request,
  and the child's report comes back. See issue-triage.html for the colours and
  the links. Dashed blue marks the subagent relationship, as it does the frames.
  No file declares subagent_create, so it has no link.
-->
