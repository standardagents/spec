<!--
  One issue_triage session (Examples, section 2). The model finds an issue
  by search when the person describes it, reads it, and labels it.

  Every node and label is defined once, in <defs>. The two layouts below only
  place those nodes and draw the edges, so a change to a label reaches both.
  Node sizes are in the comment beside each definition. Colours come from the
  --dg-* tokens in src/styles/global.css, which follow the homepage scene kit:
  yellow marks a prompt, magenta a model, purple a rule that constrains the run,
  and a solid bar a function tool.

  A node that a file defines is a link, and a blue corner marks it. The link
  stands outside <defs>, because a link inside a <use> clone takes no keyboard
  focus. rehype-file-viewers.mjs resolves data-file and data-mark, and data-name
  starts the link's accessible name. Static parts sit in one aria-hidden group.
-->
<svg class="dg-defs" width="0" height="0" aria-hidden="true" focusable="false">
  <defs>
    <marker id="it-arrow" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path class="dg-arrowhead" d="M0 .5 7.5 4 0 7.5z"/>
    </marker>

    <!-- 150 x 84 -->
    <g id="it-human">
      <rect class="dg-panel" x=".5" y=".5" width="149" height="83"/>
      <rect class="dg-mark" x="12" y="13" width="6" height="6"/>
      <text class="dg-label" x="24" y="20">SIDE B</text>
      <text class="dg-title" x="12" y="58">Human</text>
      <path class="dg-fold" d="M142 0h8v8z"/>
    </g>

    <!-- 240 x 132. Its chips are separate links, placed at x + 12 and y + 40 or y + 84. -->
    <g id="it-side-a">
      <rect class="dg-panel" x=".5" y=".5" width="239" height="131"/>
      <rect class="dg-mark" x="12" y="13" width="6" height="6"/>
      <text class="dg-label" x="24" y="20">SIDE A</text>
      <text class="dg-note" x="158" y="60.5">prompt</text>
      <text class="dg-note" x="158" y="104.5">model</text>
      <path class="dg-fold" d="M232 0h8v8z"/>
    </g>

    <!-- Chips are 136 x 32. -->
    <g id="it-chip-prompt">
      <rect class="dg-chip dg-chip--prompt" x=".5" y=".5" width="135" height="31"/>
      <text class="dg-mono" x="11" y="20.5">issue_triager</text>
      <path class="dg-fold" d="M128 0h8v8z"/>
    </g>
    <g id="it-chip-model">
      <rect class="dg-chip dg-chip--model" x=".5" y=".5" width="135" height="31"/>
      <text class="dg-mono" x="11" y="20.5">conversational</text>
      <path class="dg-fold" d="M128 0h8v8z"/>
    </g>

    <!-- 200 x 34 -->
    <g id="it-tool-read">
      <rect class="dg-bar" width="200" height="34"/>
      <text class="dg-bar-text" x="100" y="21.5">get_github_issue</text>
      <path class="dg-fold" d="M192 0h8v8z"/>
    </g>

    <g id="it-tool-label">
      <rect class="dg-bar" width="200" height="34"/>
      <text class="dg-bar-text" x="100" y="21.5">label_github_issue</text>
      <path class="dg-fold" d="M192 0h8v8z"/>
    </g>

    <g id="it-tool-search">
      <rect class="dg-bar" width="200" height="34"/>
      <text class="dg-bar-text" x="100" y="21.5">search_github_issues</text>
      <path class="dg-fold" d="M192 0h8v8z"/>
    </g>

    <!-- 90 x 34 -->
    <g id="it-github">
      <rect class="dg-external" x=".5" y=".5" width="89" height="33"/>
      <text class="dg-note dg-center" x="45" y="21.5">GitHub API</text>
      <path class="dg-fold" d="M82 0h8v8z"/>
    </g>

    <!-- Pills are 24 tall and centred on their x. Their widths are in the rects. -->
    <g id="it-rule-stop-on-response">
      <rect class="dg-pill dg-pill--rule" x="-64" width="128" height="24"/>
      <text class="dg-pill-text" y="16.5">stopOnResponse</text>
      <path class="dg-fold" d="M56 0h8v8z"/>
    </g>
    <g id="it-rule-session-turns">
      <rect class="dg-pill dg-pill--rule" x="-78" width="156" height="24"/>
      <text class="dg-pill-text" y="16.5">maxSessionTurns: 6</text>
      <path class="dg-fold" d="M70 0h8v8z"/>
    </g>
    <g id="it-rule-steps">
      <rect class="dg-pill dg-pill--rule" x="-47" width="94" height="24"/>
      <text class="dg-pill-text" y="16.5">maxSteps: 5</text>
      <path class="dg-fold" d="M39 0h8v8z"/>
    </g>
    <g id="it-rule-past-tools">
      <rect class="dg-pill dg-pill--prompt" x="-70" width="140" height="24"/>
      <text class="dg-pill-text" y="16.5">includePastTools</text>
      <path class="dg-fold" d="M62 0h8v8z"/>
    </g>

    <!-- Edge labels are centred on their x. -->
    <text id="it-edge-message" class="dg-edge-label">message</text>
    <text id="it-edge-reply" class="dg-edge-label">text reply</text>
    <text id="it-edge-call" class="dg-edge-label">tool calls</text>
    <text id="it-edge-result" class="dg-edge-label">result</text>
    <g id="it-boundary-label">
      <rect class="dg-knockout" x="-7" y="-11" width="168" height="16"/>
      <rect class="dg-mark" y="-8" width="6" height="6"/>
      <text class="dg-label" x="12">AGENT</text>
      <text class="dg-mono" x="62">issue_triage</text>
      <path class="dg-fold" d="M153-11h8v8z"/>
    </g>
  </defs>
</svg>
