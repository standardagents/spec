<svg width="980" height="650" viewBox="0 0 980 650" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Agent architecture tree</title>
  <desc id="desc">A tree diagram with a Personal Assistant Coordinator as the central dual-ai coordinator, branching to a Communications Coordinator with Gmail, Slack, and Text Message agents that receive external input and delegate inward, and a Research Assistant with Browser Use, Google Drive, and Notes agents.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="980" height="650" rx="28" fill="#F8FAFC"/>

  <g opacity="0.95">
    <rect x="40" y="30" width="170" height="54" rx="18" fill="#FFF7ED" stroke="#FB923C" stroke-width="2"/>
    <text x="125" y="52" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#9A3412">Users / External</text>
    <text x="125" y="69" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#C2410C">Channel traffic enters here</text>
  </g>

  <path d="M490 120V170" stroke="#84CC16" stroke-width="4" stroke-linecap="round"/>
  <path d="M490 170H270" stroke="#84CC16" stroke-width="4" stroke-linecap="round"/>
  <path d="M490 170H710" stroke="#84CC16" stroke-width="4" stroke-linecap="round"/>
  <path d="M270 170V230" stroke="#84CC16" stroke-width="4" stroke-linecap="round"/>
  <path d="M710 170V230" stroke="#84CC16" stroke-width="4" stroke-linecap="round"/>

  <path d="M270 320V370" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
  <path d="M270 370H130" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
  <path d="M270 370H270" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
  <path d="M270 370H410" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
  <path d="M130 370V430" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
  <path d="M270 370V430" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
  <path d="M410 370V430" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>

  <path d="M710 320V370" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
  <path d="M710 370H570" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
  <path d="M710 370H710" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
  <path d="M710 370H850" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
  <path d="M570 370V430" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
  <path d="M710 370V430" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
  <path d="M850 370V430" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>

  <path d="M210 58H300" stroke="#F97316" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"/>
  <path d="M300 58L286 50" stroke="#F97316" stroke-width="3" stroke-linecap="round"/>
  <path d="M300 58L286 66" stroke="#F97316" stroke-width="3" stroke-linecap="round"/>

  <path d="M130 430C126 350 160 320 214 288" stroke="#F97316" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"/>
  <path d="M270 430C266 350 250 320 254 288" stroke="#F97316" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"/>
  <path d="M410 430C404 350 340 320 326 288" stroke="#F97316" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"/>

  <g filter="url(#shadow)">
    <rect x="330" y="48" width="320" height="72" rx="18" fill="#ECFCCB" stroke="#84CC16" stroke-width="2"/>
    <text x="490" y="78" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#14532D">Personal Assistant Coordinator</text>
    <text x="490" y="100" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#3F6212">Central dual-ai coordinator</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="120" y="230" width="300" height="90" rx="18" fill="#E0F2FE" stroke="#38BDF8" stroke-width="2"/>
    <text x="270" y="264" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#0C4A6E">Communications Coordinator</text>
    <text x="270" y="286" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#075985">Owns inbox, chat, and messaging work</text>
    <text x="270" y="304" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#075985">Receives channel delegations and routes action</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="560" y="230" width="300" height="90" rx="18" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
    <text x="710" y="264" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#78350F">Research Assistant</text>
    <text x="710" y="286" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#92400E">Owns discovery, retrieval, and synthesis</text>
    <text x="710" y="304" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#92400E">Delegates to research specialists</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="52" y="430" width="156" height="84" rx="16" fill="#F8FAFC" stroke="#38BDF8" stroke-width="2"/>
    <text x="130" y="466" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Gmail Agent</text>
    <text x="130" y="488" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#475569">Ingress + email triage</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="192" y="430" width="156" height="84" rx="16" fill="#F8FAFC" stroke="#38BDF8" stroke-width="2"/>
    <text x="270" y="466" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Slack Agent</text>
    <text x="270" y="488" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#475569">Ingress + alerts</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="332" y="430" width="156" height="84" rx="16" fill="#F8FAFC" stroke="#38BDF8" stroke-width="2"/>
    <text x="410" y="460" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Text Message</text>
    <text x="410" y="482" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Agent</text>
    <text x="410" y="502" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#475569">Ingress + SMS</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="492" y="430" width="156" height="84" rx="16" fill="#F8FAFC" stroke="#F59E0B" stroke-width="2"/>
    <text x="570" y="460" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Browser Use</text>
    <text x="570" y="482" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Agent</text>
    <text x="570" y="502" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#475569">Live web discovery</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="632" y="430" width="156" height="84" rx="16" fill="#F8FAFC" stroke="#F59E0B" stroke-width="2"/>
    <text x="710" y="466" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Google Drive</text>
    <text x="710" y="488" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#475569">Docs and file retrieval</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="772" y="430" width="156" height="84" rx="16" fill="#F8FAFC" stroke="#F59E0B" stroke-width="2"/>
    <text x="850" y="466" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Notes Agent</text>
    <text x="850" y="488" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#475569">Private knowledge and memos</text>
  </g>

  <text x="490" y="584" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#334155">Big assistants should usually be coordinator trees made of small domain experts.</text>
  <text x="490" y="606" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748B">Some leaves are ingress points. They receive traffic and delegate inward instead of being the main planning brain.</text>
</svg>
